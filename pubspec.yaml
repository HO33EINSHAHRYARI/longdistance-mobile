name: longdistance_mobile
description: "اپلیکیشن رسمی و نیتیو شبکه اجتماعی لانگ‌دیستنس"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Network & API
  http: ^1.2.0
  webview_flutter: ^4.7.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Image Caching & Media
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  
  # UI & Animations
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

