name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (AAB for Cafe Bazaar / Myket)
        run: flutter build appbundle --release

      - name: Rename APK for release
        run: cp build/app/outputs/flutter-apk/app-release.apk longdistance_native.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: longdistance-native-apk
          path: longdistance_native.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: longdistance-bazaar-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "LongDistance Native Release v1.0.0"
          body: "Official 100% Native Flutter release for LongDistance (لانگ‌دیستنس)."
          draft: false
          prerelease: false
          files: |
            longdistance_native.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
